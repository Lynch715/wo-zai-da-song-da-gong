<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我在大宋打工</title>
<style>
  :root { --paper:#f5f0e6; --ink:#2b2b2b; --seal:#a03028; --dim:#8a8378; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#e8e0d0; color:var(--ink); font-family:"Songti SC","SimSun","Noto Serif SC",serif;
         display:flex; justify-content:center; min-height:100vh; padding:16px; }
  #app { width:100%; max-width:720px; background:var(--paper); border:2px solid var(--ink);
         box-shadow:6px 6px 0 rgba(43,43,43,.15); display:flex; flex-direction:column; }
  header { border-bottom:2px solid var(--ink); padding:10px 14px;
           display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:4px; }
  header h1 { font-size:18px; letter-spacing:4px; }
  header .day { color:var(--seal); font-weight:bold; }
  #stats { display:flex; flex-wrap:wrap; gap:6px 16px; padding:8px 14px;
           border-bottom:1px dashed var(--dim); font-size:14px; }
  #stats b { color:var(--seal); }
  #debtline { padding:6px 14px; font-size:13px; border-bottom:2px solid var(--ink); background:rgba(160,48,40,.06); }
  main { display:flex; flex:1; min-height:420px; }
  #locations { width:158px; border-right:1px solid var(--dim); padding:10px;
               display:flex; flex-direction:column; gap:8px; }
  button { font-family:inherit; font-size:14px; background:var(--paper); color:var(--ink);
           border:1px solid var(--ink); padding:8px 10px; cursor:pointer; }
  button:hover:not(:disabled) { background:var(--ink); color:var(--paper); }
  button:disabled { color:var(--dim); border-color:var(--dim); cursor:not-allowed; }
  button.seal { border-color:var(--seal); color:var(--seal); }
  button.seal:hover:not(:disabled) { background:var(--seal); color:var(--paper); }
  #panel { flex:1; padding:12px 14px; display:flex; flex-direction:column; min-width:0; }
  #scene { height:110px; margin-bottom:8px; border:1px solid var(--dim); overflow:hidden;
           background:linear-gradient(#f8f4ec,#f1ebdd); }
  #scene svg, #scene img { width:100%; height:100%; object-fit:cover; display:block; }
  #panel h2 { font-size:16px; margin-bottom:8px; border-bottom:1px solid var(--dim); padding-bottom:4px; }
  #actions { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; }
  #actions .hint { font-size:12px; color:var(--dim); }
  #log { flex:1; overflow-y:auto; max-height:240px; font-size:13px; line-height:1.7;
         border-top:1px dashed var(--dim); padding-top:6px; }
  #log .sys { color:var(--seal); }
  #log .dim { color:var(--dim); }
  #overlay { position:fixed; inset:0; background:rgba(43,43,43,.5);
             display:none; justify-content:center; align-items:center; padding:20px; z-index:10; }
  #overlay.show { display:flex; }
  #modal { background:var(--paper); border:2px solid var(--ink); max-width:480px; width:100%;
           padding:20px; max-height:85vh; overflow-y:auto; }
  #modal h3 { color:var(--seal); margin-bottom:10px; letter-spacing:2px; }
  #modal p { font-size:14px; line-height:1.8; margin-bottom:14px; white-space:pre-wrap; }
  #modal .btns { display:flex; gap:8px; flex-wrap:wrap; }
  table.trade { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:12px; }
  table.trade th, table.trade td { border:1px solid var(--dim); padding:5px 6px; text-align:center; }
  table.trade button { padding:2px 8px; font-size:12px; }
  .up { color:var(--seal); } .down { color:#3a6b4f; }
  footer { border-top:1px solid var(--dim); padding:6px 14px; font-size:12px; color:var(--dim); }
  /* 字幕式开场/结局 */
  #cine { position:fixed; inset:0; background:#efe8d8; z-index:20; display:none;
          overflow-y:auto; -webkit-overflow-scrolling:touch; padding:28px; }
  #cine.show { display:flex; }
  #cine .c-wrap { margin:auto; display:flex; flex-direction:column; align-items:center;
                  text-align:center; width:100%; }
  #cine .c-img { max-width:min(560px,92vw); max-height:38vh; border:2px solid var(--ink);
                 box-shadow:4px 4px 0 rgba(43,43,43,.2); margin-bottom:20px;
                 opacity:0; animation:fadeup 1.2s .1s forwards; }
  #cine .c-img:not([src]) { display:none; }
  #cine .c-title { font-size:34px; letter-spacing:12px; color:var(--ink); margin-bottom:26px;
                   opacity:0; animation:fadeup 1.2s .2s forwards; }
  #cine .c-body { max-width:520px; font-size:16px; line-height:2.2; white-space:pre-wrap;
                  color:var(--ink); opacity:0; animation:fadeup 1.4s 1s forwards; }
  #cine .c-seal { margin-top:30px; width:74px; height:74px; border:3px solid var(--seal); color:var(--seal);
                  display:flex; justify-content:center; align-items:center; font-size:26px; letter-spacing:2px;
                  transform:rotate(-8deg) scale(3); opacity:0; animation:stamp .5s 2.6s forwards; }
  #cine .c-btn { margin-top:34px; opacity:0; animation:fadeup 1s 3.2s forwards; }
  #cine .c-btn button { padding:10px 34px; letter-spacing:6px; font-size:15px; }
  #cine.rush .c-img, #cine.rush .c-title, #cine.rush .c-body, #cine.rush .c-btn
        { animation:none !important; opacity:1 !important; transform:none !important; }
  #cine.rush .c-seal { animation:none !important; opacity:1 !important; transform:rotate(-8deg) scale(1) !important; }
  #cine .c-hint { margin-top:14px; font-size:12px; color:var(--dim); letter-spacing:2px; }
  /* 矮屏幕（笔记本）压缩开场，保证按钮可见 */
  @media (max-height: 780px) {
    #cine { padding:16px; }
    #cine .c-img { max-height:24vh; margin-bottom:12px; }
    #cine .c-title { font-size:26px; letter-spacing:8px; margin-bottom:14px; }
    #cine .c-body { font-size:14px; line-height:1.9; }
    #cine .c-seal { margin-top:16px; width:58px; height:58px; font-size:22px; }
    #cine .c-btn { margin-top:18px; }
  }
  @keyframes fadeup { from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
  @keyframes stamp { from{opacity:0; transform:rotate(-8deg) scale(3);} 60%{opacity:1; transform:rotate(-8deg) scale(.92);} to{opacity:1; transform:rotate(-8deg) scale(1);} }
  /* ―――― 手机适配 ―――― */
  @media (max-width: 560px) {
    body { padding:6px; }
    main { flex-direction:column; min-height:0; }
    #locations { width:100%; border-right:none; border-bottom:1px solid var(--dim);
                 flex-direction:row; flex-wrap:wrap; gap:6px; padding:8px; }
    #locations button { flex:1 1 30%; padding:10px 4px; font-size:13px; white-space:nowrap; }
    #scene { height:80px; }
    #stats { font-size:13px; gap:4px 10px; }
    #debtline { font-size:12px; }
    button { padding:10px 12px; }
    #actions button { width:100%; text-align:left; }
    #actions .hint { display:block; margin:2px 0 0 2px; }
    #log { max-height:180px; }
    #modal { padding:14px; }
    #modal .btns button { padding:12px 14px; flex:1 1 40%; }
    #cine .c-title { font-size:26px; letter-spacing:8px; }
    #cine .c-body { font-size:14px; line-height:2; }
  }
</style>
</head>
<body>
<div id="app">
  <header><h1>我在大宋打工</h1><span class="day" id="hdr-day"></span></header>
  <div id="stats"></div>
  <div id="debtline"></div>
  <main>
    <div id="locations"></div>
    <div id="panel"><div id="scene"></div><h2 id="loc-title"></h2><div id="actions"></div><div id="log"></div></div>
  </main>
  <footer>宣和三年 · 临汴城 ｜ 五个结局，路怎么走你自己挑</footer>
</div>
<div id="overlay"><div id="modal"><h3 id="m-title"></h3><p id="m-text"></p><div class="btns" id="m-btns"></div></div></div>
<div id="cine"><div class="c-wrap"><img class="c-img" id="c-img" alt=""><div class="c-title" id="c-title"></div><div class="c-body" id="c-body"></div><div class="c-seal" id="c-seal"></div><div class="c-btn"><button id="c-btn"></button></div><div class="c-hint">点击任意处可跳过动画</div></div></div>

<script>
"use strict";
/* ================= 常量（数值来自02-数值稿 v0.2） ================= */
const GUAN = 1000;
const TOTAL_DAYS = 30;
const SLOTS = ["上午","下午","夜晚"];
const DEBT_INIT = 100*GUAN;
const NODES = {10:20*GUAN, 20:55*GUAN};
const FOOD_COST=150, RENT_COST=1*GUAN, SICK_COST=500, VIOLATE_INTEREST=5*GUAN, SALARY=2*GUAN;
const GOODS = [
  {id:"rice", name:"米",   base:700},
  {id:"cloth",name:"布",   base:1500},
  {id:"tea",  name:"茶",   base:1800},
  {id:"herb", name:"药材", base:3000},
  {id:"salt", name:"私盐", base:2200, gray:true}, // 官榷货，贩卖涨恶名
];

/* 小案模板×36：多取材历代公案（十五贯、乌盆、双钉、灰阑、审驴等），线索不点名，须自行推断 */
const CASE_POOL = [
  // ―――― 难度★（2条线索，赏3贯） ――――
  {name:"布庄失窃案", diff:1, reward:3*GUAN, suspects:["学徒小乙","更夫老周","泼皮牛三"], culprit:0,
   clues:["失的是柜底三匹蜀锦，压箱的粗布一匹没动。贼识货，还知道锦搁在哪一层。",
          "后门门闩是从里头落的，看门的狗一声没叫。掌柜说，那夜铺子里只歇着一个人。"]},
  {name:"瓦子斗殴案", diff:1, reward:3*GUAN, suspects:["说书人","卖炊饼的武大","外乡客商"], culprit:2,
   clues:["伤者后脑挨的是一只酒坛，碎瓷是梨花白的官贴——这一坛，抵瓦子半月赁钱。",
          "当夜赁雅座点梨花白的只有一位，天不亮退了房，酒账都没结。"]},
  {name:"割牛舌案", diff:1, reward:3*GUAN, suspects:["有宿怨的邻人","过路牛贩","流窜的泼皮"], culprit:0,
   clues:["牛栏的柴门没动，割舌的人是翻墙进去的——牛栏后墙，只隔着一家的院子。",
          "牛舌卖不出几个钱，这是泄愤。为着三尺田界，两家已骂了半年。"]},
  {name:"油钱失窃案", diff:1, reward:3*GUAN, suspects:["歇脚的挑夫","桥头的闲汉","过路的货郎"], culprit:1,
   clues:["卖油翁的钱串子常年浸着油腥。你让三人把身上铜钱丢进水盆——有一把，浮起了油花。",
          "闲汉咬定一早就在桥头没挪过窝，可桥头茶棚的博士，不记得给他续过一回水。"]},
  {name:"偷鹅案", diff:1, reward:3*GUAN, suspects:["隔壁孙寡妇","挑担的货郎","屠户学徒"], culprit:1,
   clues:["鹅是白日没的。笼门开着，没血没毛——不是黄鼠狼，是人顺手牵的。",
          "货郎当日挑担出城，担子一头蒙着布。过税卡时，布底下叫了一声。"]},
  {name:"醉汉坠河案", diff:1, reward:3*GUAN, suspects:["同饮的船工","讨债的泼皮","并非人为，是失足"], culprit:2,
   clues:["岸边泥地只有一行脚印，深一脚浅一脚，歪歪斜斜——是死者自己的。",
          "船工亥时就回了船，船头作证；泼皮当夜在赌坊押宝，输到天亮才出门。"]},
  {name:"假香油案", diff:1, reward:3*GUAN, suspects:["城南油坊主","串巷的油贩","油坊伙计"], culprit:1,
   clues:["吃倒人的香油里掺了桐油。油坊出货都有坊记封泥，出坊时验过，是好油。",
          "串巷的油贩子那两日收摊极早，几只油桶刷得干干净净——刷得太干净了。"]},
  {name:"碰瓷讹车案", diff:1, reward:3*GUAN, suspects:["倒地的老汉","赶车的脚夫","路边起哄的闲人"], culprit:0,
   clues:["老汉倒地的位置，离车辙足有三尺，衣裳上没有一星泥辙印。",
          "搀他喊冤的‘儿子’来得太快——从巷口到街心，一眨眼就到，像是候着的。"]},
  {name:"鱼行短秤案", diff:1, reward:3*GUAN, suspects:["鱼牙子","做秤的秤匠","鱼行伙计"], culprit:0,
   clues:["各摊的秤出自同一家秤铺，单单鱼牙那杆，后头三颗秤星锉过又描过。",
          "秤匠的底簿记着一笔：这杆秤是照买主吩咐做的‘省秤’，工钱还加了三成。"]},
  // ―――― 难度★★（3条线索，赏5贯） ――――
  {name:"骡马失窃案", diff:2, reward:5*GUAN, suspects:["马行牙人","邻家屠户","流民汉子"], culprit:0,
   clues:["马厩的锁没有撬痕，是钥匙或者拨子开的，手法熟得很。",
          "失的青骡三日后在邻县马市过了契，契上经手人的花押洗改过，认不出名姓。",
          "本城能写马契、又常跑邻县马市的，扳着指头数不出几个。"]},
  {name:"当铺收赃案", diff:2, reward:5*GUAN, suspects:["当铺掌柜","当铺伙计","来当东西的婆子"], culprit:1,
   clues:["失主的金钗进了当铺，可当簿上没这一笔——收当的人绕开了明账。",
          "掌柜的眼力，认出赃物不难；他若真敢收，早脱手了，不会留在柜上等人查。",
          "柜上新来的伙计月钱五百文，这月却添了身杭绸直裰。"]},
  {name:"功德箱失窃案", diff:2, reward:5*GUAN, suspects:["庙祝","上香的里正","山门外的乞儿"], culprit:0,
   clues:["功德箱的铜锁完好，箱底板却被人起开又钉了回去，钉眼是新的。",
          "乞儿夜里睡在山门外进不来，里正初一才来上香。能在庙里从容抡锤凿的，没几个人。",
          "赌坊伙计记得清楚：上月有位出家打扮的常客，把一年的会钱输了个精光。"]},
  {name:"十五贯疑案", diff:2, reward:5*GUAN, suspects:["死者女儿的相好","赌坊的娄二","肉案合伙人"], culprit:1,
   clues:["屠户死在肉案后，枕下攒的十五贯只剩空匣。他女儿的相好身上恰好搜出十五贯——他说是贩丝的本钱。",
          "那后生若真谋财害命，不会天亮了还挑着担子大摇大摆走官道。",
          "赌坊的娄二当夜输了个精光，五更天却又回去翻了本。他押宝的铜钱上，沾着肉案的油腥。"]},
  {name:"乌盆案", diff:2, reward:5*GUAN, suspects:["城外窑户","同行的客商","赶脚的车夫"], culprit:0,
   clues:["失踪的客商最后一站是城外窑场，借宿了一夜，此后再没人见过。",
          "窑户说客商天不亮就动身了，可客商的骡子，还拴在窑场后头吃草。",
          "那几日窑火烧得比往常旺。新出的一窑黑盆，窑户一只也不肯卖。"]},
  {name:"双钉案", diff:2, reward:5*GUAN, suspects:["死者的浑家","死者的兄弟","游方郎中"], culprit:0,
   clues:["尸身无伤无毒，仵作验了三遍。唯独发髻散着——入殓的人说，是他浑家执意亲手给丈夫梳的头。",
          "老仵作他娘提点了一句：验发顶。百会穴里，两枚铁钉，钉帽都锉平了。",
          "游方郎中月前来卖过一回‘安神方’，此后再没进过城；兄弟分家在外，进不得内室。"]},
  {name:"灰阑争子案", diff:2, reward:5*GUAN, suspects:["先松手的张氏","抢到娃的李氏","过路的牙婆"], culprit:1,
   clues:["两个妇人都咬定娃是亲生。你在堂前画了个灰圈，让二人各执一臂拽娃出圈。",
          "张氏拽到一半，娃一哭，她便松了手；李氏一把将娃拽了过去，先看的是你的脸色。",
          "查李氏的街坊：她的亲儿，去年出痘没保住。"]},
  {name:"审驴案", diff:2, reward:5*GUAN, suspects:["驴行牙人","同槽的赶脚汉","盗驴惯犯"], culprit:1,
   clues:["好驴换成了瘦驴。生人牵驴，驴是要踢要叫的——换驴的人，驴认得。",
          "你把瘦驴饿了三日放开，它一路小跑，钻回的是同槽赶脚汉的棚。",
          "赶脚汉说瘦驴是新买的，却拿不出契，也说不清卖主。"]},
  {name:"供银失踪案", diff:2, reward:5*GUAN, suspects:["观音庙住持","看殿的庙祝","挂单的行脚僧"], culprit:0,
   clues:["求子的妇人夜里供在佛前的银锞子，天亮总会‘被神收去’。庙里说这是灵验。",
          "供银的净室夜里反锁，钥匙只有一把，不在庙祝手里。",
          "净室佛龛后有道暗门，门轴上了新油——通的是住持的禅房。"]},
  {name:"花轿失箱案", diff:2, reward:5*GUAN, suspects:["轿夫头","跟轿的媒婆","男方管家"], culprit:1,
   clues:["嫁妆半路少了一箱首饰。箱锁没撬，是用备匙开的。",
          "嫁妆单子上写明：备匙两把，女家收一把，另一把——交给了保媒的。",
          "当夜城西当铺进了一支赤金簪，当票上的日子时辰，对得严丝合缝。"]},
  {name:"井中尸案", diff:2, reward:5*GUAN, suspects:["同院的租客","淘井的井匠","死者的赌友"], culprit:1,
   clues:["尸身坠着石头沉在井底。绑石的绳结，是拴辘轳用的活结手法。",
          "井台的青苔蹭掉一片，位置刁钻——是熟惯井口的人踩出来的。",
          "上月死者请人淘过井，为着工钱，和淘井的吵了一场，没给全。"]},
  {name:"移尸讹诈案", diff:2, reward:5*GUAN, suspects:["死者的族叔","街面的地头蛇","对门的绸缎庄对头"], culprit:0,
   clues:["尸身停在绸缎庄门口，一族人哭着要庄家偿命。可仵作一验：病亡，且死了至少两日。",
          "抬尸堵门要人手。天没亮，一族人便‘恰好’聚齐了，孝服都是现成的。",
          "死者的族叔，前日刚在这家绸缎庄赊账，被伙计当街驳了面子。"]},
  {name:"夹铜银铤案", diff:2, reward:5*GUAN, suspects:["来当银的行商","城西银铺匠人","当铺朝奉"], culprit:1,
   clues:["当铺收进的官铤剖开一看，夹的是铅铜。戳记仿得极像，錾工却是私铸的手路。",
          "行商叫起撞天屈：银子是城西银铺兑的，兑单还在——他自己也是受害的。",
          "城西银铺的老匠人半月前辞了工，乡下家里，起了三间新瓦房。"]},
  {name:"冒继绝产案", diff:2, reward:5*GUAN, suspects:["自称侄儿的后生","隔壁邻人","写保书的牙保"], culprit:0,

"乌盆案": {
 intro:"贩绸的客商刘世昌离了临汴城，就再没人见过。他家里人寻到城外窑场，窑户赵大一口咬定：人天不亮就走了。\n可寻人的人还没进城，先在旧货摊上撞见一只黑盆——摊主说，夜里搁在屋角，那盆自己会哭。",
 clues:["失踪的客商最后一站是城外窑场，借宿了一夜，此后再没人见过。",
        "窑户说客商天不亮就动身了，可客商的骡子，还拴在窑场后头吃草。",
        "那几日窑火烧得比往常旺。新出的一窑黑盆，窑户一只也不肯卖。",
        "窑场后的土堆是新翻的，土里筛出两颗牙、几片没烧透的骨渣，还有一枚烧得发黑的银锞子。",
        "客商随身带的绸货，半个月内在东市脱了手——买主说，卖货的是个满身窑灰的汉子，急着换钱，价压得极低。"],
 say:["窑户赵大：“他天不亮就走了，我送到路口的。”（你问他既送到路口，怎么没见着骡子还拴在后头，他答不上来）",
      "同行客商：“我们在城里就分了手，他要往南，我要往北。他那一箱绸货值七八十贯，谁不眼红。”",
      "赶脚车夫：“我拉的是空车回程，路上遇见过他一回，他还给了我两个炊饼。人挺和气的。”"],
 verdict:"窑火再旺，也烧不尽一个人。\n赵大见财起意，夜里下了手，尸首和着泥进了窑，绸货低价出脱。他以为烧成了盆，就没人认得出——可土里的那两颗牙认得出，骡子认得出。\n你把那只黑盆一并带回衙门，判词写完，才让人把盆送回刘家：装了骨殖，好歹是个归处。\n判：谋财害命，弃尸窑中，斩。",
 miss:"你拿错了人。窑户赵大照旧烧他的窑，只是从此再不留客借宿。那只会哭的黑盆后来被人摔了，摔的时候，掉出半颗牙。"
},
"双钉案": {
 intro:"街东的周三死了。无病无灾，睡下去就没再起来。仵作验了三遍，浑身上下寻不出一处伤，也验不出毒。\n入殓那天，他浑家哭得几乎背过气去，还执意亲手替丈夫梳了头——她说，他生前最爱干净。",
 clues:["尸身无伤无毒，仵作验了三遍。唯独发髻散着——入殓的人说，是他浑家执意亲手给丈夫梳的头。",
        "老仵作他娘提点了一句：验发顶。百会穴里，两枚铁钉，钉帽都锉平了。",
        "游方郎中月前来卖过一回‘安神方’，此后再没进过城；兄弟分家在外，进不得内室。",
        "铁钉不是铺子里买的，钉帽锉过、钉身磨细，是照着不留痕迹的意思改的。城里能干这活的铁匠，认得出那把锉。",
        "铁匠记得：上月有个妇人拿两枚寸钉来改细，说是钉窗棂用的。窗棂用不着锉钉帽。"],
 say:["浑家：“我夫君睡着走的，是福气。”（问她为何执意亲手梳头，她说“外人手粗”；问她铁匠的事，她的手在袖子里抖）",
      "兄弟：“分家分得难看，我三年没进过他家门，街坊都作得了证。我恨他，可我要他的钱，不要他的命。”",
      "游方郎中：“安神方是我卖的，方子在这儿，官人尽可拿去问药铺——不过一味酸枣仁、一味茯神，吃不死人。”"],
 verdict:"梳头是为了盖钉眼。她一天梳三回，怕的是那两点新肉长不平。\n她与人有私，谋算了半年，等丈夫喝了安神汤睡沉，才下的钉。锉平钉帽，是怕摸得着；亲手入殓，是怕别人摸。\n老仵作他娘拄着拐来听判，判完了才说一句：“我年轻时也是这么冤过一个人的，才记住要验发顶。”\n判：谋杀亲夫，凌迟。奸夫同罪。",
 miss:"你拿错了人。周三入了土，坟头草长了一年。第二年他浑家改嫁，新郎官也是睡下去就没起来——那时候你才想起发顶那两枚钉。"
},
"灰阑争子案": {
 intro:"两个妇人抱着同一个三岁小儿闹上了堂。张氏说是自己十月怀胎，李氏说是自己一把屎一把尿。\n街坊各执一词，接生婆早已过世，户帖上又没来得及添这一笔。娃在堂下哭得撕心裂肺，两个妇人谁也不肯松手。",
 clues:["两个妇人都咬定娃是亲生。你在堂前画了个灰圈，让二人各执一臂拽娃出圈。",
        "张氏拽到一半，娃一哭，她便松了手；李氏一把将娃拽了过去，先看的是你的脸色。",
        "查李氏的街坊：她的亲儿，去年出痘没保住。",
        "娃身上有一处旧疤，是烫的。张氏说得出年月、说得出是哪只碗打翻的；李氏说“记不清了”。",
        "娃夜里哭，抱到李氏怀里越哭越凶，闻见张氏的衣裳倒安静下来——三岁的孩子不会作伪证，可他认得出气味。"],
 say:["张氏：“官人要打要罚都随您，只求别再拽他了——他胳膊嫩。”",
      "李氏：“我养他三年，喂的奶、缝的衣，凭什么她一句话就带走？”（她说“养”不说“生”，说了三回）",
      "牙婆：“我不过是牵个线的。有人托我寻个丢了孩子的人家，我哪知道后头这些事。”"],
 verdict:"灰圈里拽不出真娘。会松手的那个，才是。\n李氏去岁丧子，痛得糊涂了，抱走了张氏的孩子当自己的养，日子久了，连自己也信了。牙婆两头收钱，替她圆了这三年的谎。\n判：孩子归张氏。李氏杖二十，你把杖数减了一半——她抱着空襁褓在堂下哭的时候，满堂没一个人笑得出来。牙婆枷号示众，逐出本城。",
 miss:"你把娃判给了李氏。张氏没闹，磕了个头就走了。后来有人在城外看见她，坐在路边，手里还攥着那件没送出去的小袄。"
},
"审驴案": {
 intro:"卖柴的王五清早发现，槽上那头膘肥的青驴换成了一头瘦骨嶙峋的。驴还是驴，可柴驮不动了。\n没有失主、没有见证，一头驴也值不了几个钱——但王五一家老小，就指着这头驴吃饭。",
 clues:["好驴换成了瘦驴。生人牵驴，驴是要踢要叫的——换驴的人，驴认得。",
        "你把瘦驴饿了三日放开，它一路小跑，钻回的是同槽赶脚汉的棚。",
        "赶脚汉说瘦驴是新买的，却拿不出契，也说不清卖主。",
        "青驴的左前蹄铁是本城马蹄铺新钉的，钉眼偏一分。城外二十里的驿站里，正拴着一头这样蹄铁的青驴。",
        "驿站的人说，那驴是个赶脚的抵了店钱押下的，抵账的日子，正是王五丢驴那天。"],
 say:["驴行牙人：“我只管说合，成一桩抽两文。谁牵谁的驴，我懒得管。”",
      "赶脚汉：“那瘦驴是我买的，卖主是个外乡人，走了。”（问他为何瘦驴认得回他的棚，他说“畜生不认路，瞎跑的”）",
      "盗驴惯犯：“我偷驴是牵了就卖，从没干过换驴这种赔本买卖。官人查我前科可以，这桩不是我。”"],
 verdict:"驴不会说谎。它饿了三天，只认养它的槽。\n赶脚汉见王五的青驴壮实，夜里牵了自家的瘦驴换过来，青驴则赶到城外驿站抵了店钱——他算准了：驴没有契、没有人证，丢了也是白丢。\n青驴牵回来那天，王五抱着驴脖子说了半天话。判：赔青驴、还瘦驴，杖四十。",
 miss:"你判错了。王五牵着那头瘦驴回家，从此柴担改成人挑。他没再来衙门告过状。"
},
"拐骗孩童案": {
 intro:"糖摊前少了个孩子。五岁，穿红肚兜，是南街布商的独苗。\n城门当日就封了，衙门捕快撒出去二十个，一天一夜没有消息。孩子的娘跪在衙门口不肯起来，嗓子已经哭哑了。",
 clues:["孩子是在糖摊前被牵走的。摊主记得那人袖口有股子药香，说话是本地口音。",
        "行脚僧当日晌午在城外庵里挂单，有僧众作证；耍猴班主的猴儿病了，他一整日没出棚。",
        "西巷王婆这几日在码头打听南下的船，还抓了两服安神药。她无儿无女，安神药给谁吃？",
        "药铺的簿子记着：王婆抓的是麻沸散的底方，剂量按小儿减的。她自称失眠——失眠的人不吃这个。",
        "码头船帮的人说，王婆订了两个铺位，说是带着‘生病的孙儿’南下投亲。她哪来的孙儿？"],
 say:["耍猴班主：“猴儿病了三日，我守着它喂药，棚都没出。一条街的人都听见猴叫。”",
      "行脚僧：“贫僧晌午在城外庵中挂单，晚课都在。官人可去问庵主。”",
      "王婆：“我一把年纪，拐个孩子做什么？”（问她安神药给谁吃，她说给自己；问她船上那个‘孙儿’，她的脸一下子白了）"],
 verdict:"你在码头把船拦了下来。舱底的席子底下，孩子睡得昏昏沉沉，嘴里还有药味。\n王婆做的是拐卖的中人，南边一个孩子二十贯，她已经做了三回。前两回没人报官——那两家的孩子，是流民的。\n孩子他娘抱着孩子在衙门口哭得站不起来。判：略卖人口，绞。同伙船户杖一百，刺配。\n你回衙门翻旧档，把前两桩没人报的失踪，重新立了案。",
 miss:"你拿错了人。第二日一早，那条南下的船已经出了闸。孩子他娘在衙门口跪了整整一个月，后来就不来了。"
},
"负心书生案": {
 intro:"柳湾捞起两具尸首：一个年轻妇人，一个五六岁的男孩，母子相抱。\n没人认得他们。妇人是外乡口音，孩子手里死死攥着半块玉。城里正热闹着——新科的秦相公入赘富户，三日后完婚。",
 clues:["母子俩落水处不是渡口，是上游僻静的柳湾——那种地方，得有人约才会去。",
        "孩子手里攥着半块蟠龙玉佩。秦相公行囊里那半块，严丝合缝，是一对。",
        "秦相公新入赘了本城富户，对人只说家中父母双亡，从未婚娶。",
        "妇人指甲缝里有布屑，是杭绸的经纬——那种绸，本城只有三家穿得起，秦相公的新衣正是其一。",
        "柳湾岸上的芦苇倒了一片，脚印三双：两双小的朝水里去，一双大的，又折了回来。"],
 say:["秦相公：“素不相识。玉佩是我家祖传的，早年丢过一块——天下玉佩，哪有独一份的？”（他答话时，眼睛始终没往那两具尸首看）",
      "岳家管家：“姑爷是新科进士，我家老爷千挑万选的。这等泼污水的事，官人可要担着干系。”",
      "艄公：“柳湾那地界水急，没人往那儿去。那日我在渡口摆了一整天，来回二十几趟，客人都记得我。”"],
 verdict:"半块玉合上了。他终于不再说话。\n乡下的妻带着孩子千里寻夫，寻到的是一场入赘的喜事。他约她到柳湾说“商量个法子”，法子就是水。\n判词写完，你在卷末添了一行：那孩子攥玉佩的手，掰了三个人才掰开。\n判：谋杀妻子，斩。功名革除，姓名从榜上剜去。",
 miss:"你没能定他的罪。三日后秦相公风光成婚，鼓乐吹过衙门口。柳湾那对母子草草葬在乱坟岗，无碑。那半块玉佩，你留了很多年。"
},
"真假遗嘱案": {
 intro:"老员外方九畴一死，两个儿子当堂翻脸。\n长子拿的是族里公认的那份分产文书，幼子拿的是一份“临终手书”：家私九成归幼子。\n两份都盖着方家的私印，两份都有人作证。族里三十几口人，吵成了一锅粥。",
 clues:["幼子拿出的那份遗嘱，纸是新纸熏旧的——茶渍浮在墨迹上头：先写的字，后做的旧。",
        "老员外病重那年手抖得握不住箸，这份遗嘱上的小楷，却端正得能进帖。",
        "塾师替幼子发蒙十年，笔迹外人难辨。幼子许过他：事成，分一成家产。",
        "遗嘱落款的年月里，有一个字避的是本朝新讳——那道避讳的旨意，是老员外死后半年才下的。",
        "纸铺的伙计认得这种玉版纸：一刀二百文，进城才两个月，只卖出去三家，其中一家是州学的塾师。"],
 say:["长子：“我不识字，也不会写字。族里的分产文书是当着二十几口人立的，我要作假，作得过这么多眼睛？”",
      "塾师：“我不过是教书的，方家的家私与我何干。”（问他玉版纸的事，他说“写字用的”；问他为何遗嘱上避的是新讳，他一句话说不出）",
      "管家：“老爷最后那半年，谁进过卧房我都记得。塾师进去过三回，每回都带着纸墨。”"],
 verdict:"死人不会避活人的讳。这一个字，抵得过十个证人。\n塾师代笔伪作，幼子许他一成家产。纸是新买的玉版，用茶熏旧，只是熏得太用心——茶渍压在墨上，先后一眼看得出。\n判：伪造文书，塾师杖一百、刺配；幼子夺产不成，罚没所分之半，充作族中义庄。长子当堂给弟弟留了三成——他说，爹要是活着，也不忍看兄弟分成这样。",
 miss:"你判了那份假遗嘱。长子领着一家老小搬去了城外。两年后州学换了教授，塾师捐了个小官，逢人便讲他当年怎么替东家‘辩冤’。"
},
"库银调包案": {
 intro:"州库解京的三十鞘官银，出库时封条完好，到京一剖：铅锭。\n三十鞘，一万两，从库房到码头，经手的不过那么几个人。文书递到州衙，限十日破案——破不了，一路的官，从上到下都要落职。",
 clues:["库门封条完好，银鞘却轻了——剖开火漆，里头是铅锭。火漆是重新打过的。",
        "打鞘封要用官印钳。那钳子平日锁在司库房内，钥匙不离身。",
        "司库官俸钱几何，人尽皆知。可他上月，在汴京置了一处三进的宅子。",
        "铅锭的成色出自城西一家私炉。私炉的老匠人说，定货的人是拿着官府的样鞘来的——只有见过鞘的人，才做得出这么合缝的模子。",
        "库丁的班簿被人改过：调包那夜的守夜名单，原本的名字用刀刮了，又填上一个当夜请假的人。改字的墨，和司库房的墨是一样的。"],
 say:["库丁：“那夜排的不是我的班，班簿上写着谁我不知道，反正我在家。官人要打要问，我认；这钱我一文没见过。”",
      "押运厢军：“我们接的是封好的鞘，验封不验银，这是规矩。一路上鞘没离过眼。”",
      "司库官：“钥匙我贴身带着，从没离过手。”（正因如此，钳子只有他动得了；至于汴京的宅子，他说是“内人的陪嫁”——他内人是本城船户的女儿）"],
 verdict:"钥匙不离身，正是他最要命的一句话。\n司库官换银、重打火漆、又刮改班簿栽给守夜的库丁。他算准了：封条完好，谁也想不到从里头开。可私炉的模子要照着官鞘做，班簿的墨也要从他房里取。\n判：监守自盗，绞。汴京的宅子入官，三十鞘银追回十九鞘——余下的，他都赌输了。\n库丁放出来那天，在衙门口站了很久，你请他喝了碗热汤。",
 miss:"你把库丁定了案。人押走那天喊了一路的冤。案子结了，司库官在汴京又添了一处宅子——听说，还替你在上头美言过几句。"
}
};

          "有个脚夫吃了两碗酒就漏了嘴：那些“空麻袋”沉得压肩，连夜抬进了赌坊后院。",
          "赌坊后院那几日进出的车，走的都是南门。南门的守卒记得：车上盖着席，压得车辙极深，可押车的人有牌子，验都不用验。"],
   say:["仓吏赵四：“搬空麻袋而已，工钱是我垫的，图个人情。”（问他空麻袋为何压肩，他说“脚夫吃醉了乱讲”）",
        "船工王五：“船靠岸我就交了封条，过秤的册子上有我的押。货进了仓，跟我还有什么相干？”",
        "牙人钱六：“我只管说合，货是周二郎自己押的。他跑了，你们找我做什么？”"],
   grayText:"船主陪着笑把一封银子推过来：“官人，报个水匪劫了便是。苦主是外乡人，闹不起来的。”（+15贯，恶名+10，主线就此断线）",
   grayGain:15*GUAN, grayInfamy:10,
   done:"赵四画了押，只认拿钱搬货。问钱是谁给的，他把头摇成了拨浪鼓。\n货进了赌坊后院——赌坊的东家，又是谁？\n出堂时你想起周二郎最后一封信上那句话：“砚哥，这事我说不清。”"},

  {name:"赌坊假账案", reward:10*GUAN, unlock:8,
   suspects:["账房遗孀","赌坊打手","金府管家"], culprit:2,
   intro:"赌坊的账房吴先生死了。死在自家炕上，衣裳齐整，像是睡过去的。\n他是上个月开始跟人打听“怎么告状”的——问的正是绸货那桩事。",
   clues:["赌坊账房吴先生死在自家炕上。桌上半盏冷茶，凑近一闻，杏仁味。仵作验了：砒霜。",
          "吴先生死前誊过半本账，残页缝在他浑家的夹袄里——每笔大进项旁边，都画着同一个花押。",
          "对门婆子说，出事前夜有人提着食盒进了吴家，出来时食盒没了。那人穿金府的青布褂。",
          "药铺的簿子上，半月前有人以“毒鼠”为名买过砒霜，具的是金府别院的名号。签字的手，写字极工整。",
          "吴先生的浑家哭着说了实话：他打算把账本递到监司去。走漏消息的那一晚，他还请金府管家吃了顿酒——他以为管家是自己人。"],
   say:["账房遗孀：“我男人一辈子胆小，临了要做件胆大的事，就没了。那半本账我缝在袄里，谁也没给看。”",
        "赌坊打手：“我拿钱看场子，弄死账房对我有什么好处？账没了，我的工钱找谁要？”",
        "金府管家：“食盒是我送的，人情往来罢了。”（问他药铺那笔砒霜，他说是别院闹鼠；问他别院在哪，他报了个去年就卖掉的地方）"],
   grayText:"金府管家寻上门来，开口就是二十四贯：“买回那几页废纸。吴先生已经死了，官人何必替死人出头。”（+24贯，恶名+10，主线就此断线）",
   grayGain:24*GUAN, grayInfamy:10,
   done:"管家下了狱，咬死不认。但残页在你手里——你把那个花押比着金满堂借据上的印记，看了半宿。\n一个手笔。\n夜里你翻出周二郎那张借据：作保人一栏，是你自己的字。"},

  {name:"泗州访故人", reward:10*GUAN, unlock:14,
   suspects:["赌坊掌柜柳三","放印子的牙人","周二郎自己"], culprit:0,
   intro:"码头船工的话是真的：周二郎在泗州。\n蓄了胡子，在人家船上做帐房，见人就低头。你到的时候，他正蹲在船尾洗碗，一抬头，碗掉进了水里。\n“砚哥……”他叫了一声，就再没说出第二句。",
   clues:["周二郎不是卷款跑的。货款他一文没动，是在赌坊被人“借”走的——借条上按的是他的手印，可他说自己那晚醉得连笔都握不住。",
          "他从不赌。是赌坊掌柜柳三请的酒，酒里有东西——他醒来时，欠条已经写好了，二十贯。",
          "二十贯变一百贯，只用了四个月。借据上的利息涂改过：三分利涂成一分利，涂改处对着日头，一照就现。",
          "柳三的赌坊，去年秋天换过一次东家。契书上的买主写的是柳三，出钱的人却在契尾添了一笔小字——那个花押，你已经见过两回了。",
          "周二郎藏着一样东西：那晚的借条底稿。写字的不是他，是柳三的手笔——他连自己的名字，都被人代写了。"],
   say:["赌坊掌柜柳三：“他自己愿赌服输，写的欠条，按的手印。”（问他为何请一个从不赌的人喝酒，他笑了笑：“朋友嘛。”）",
        "放印子的牙人：“我只管放钱收息，谁欠的债我不问来路。三分利是行价，官人要查，满城的印子钱都得查。”",
        "周二郎：“砚哥，我跑，是怕连累你。我一走，债就只剩下你一个作保的——我到泗州才想明白，这正是他们要的。”"],
   grayText:"柳三托人捎话：“沈捕头，周二郎的事到此为止，三十贯，您那一百贯的债，我替您说个情，再免二成。”（+30贯，恶名+10，主线就此断线）",
   grayGain:30*GUAN, grayInfamy:10,
   done:"柳三押回临汴那天，一路骂骂咧咧，直到你把借条底稿摊在他面前。\n设局、灌酒、代笔、涂利——一整套手法熟得像做惯的营生。而这营生的东家，藏在契尾那个花押后头。\n周二郎跟你回了城。进城门时他说：“砚哥，那一百贯，我一起还。”\n你说：还不还得清另说，先把人抓齐。"},

  {name:"衙里的耳目", reward:12*GUAN, unlock:20,
   suspects:["押司孔目","值堂的老兵","司理院的书吏"], culprit:0,
   intro:"你查到哪儿，金家就先躲到哪儿。\n提柳三那天，赌坊的账本前一夜就搬空了；要拿别院的人，别院已经空了三日。\n衙门里有人在给金满堂通消息。这个人，天天跟你打照面。",
   clues:["每回出票拿人，票签发出去不到一个时辰，人就走脱。能提前一个时辰知道的，只有经手票签的那几双手。",
          "你使了个法子：写了三张不同去处的假票，分给三个人经手。当夜只有一处扑了空——扑空的那张，经的是押司的手。",
          "押司家的用度，早不是三十贯年俸撑得起的：儿子在州学，女儿的嫁妆抬了十六抬。",
          "金家的账上有一笔按月支出，名目写的是“茶汤钱”，每月三贯，走了三年——三年前，正是他补上押司这个缺的时候。",
          "老押司见事情兜不住了，反过来递给你一样东西：他这三年替金家递消息的往来条子，一张没舍得烧。他说，留着，是为了万一。"],
   say:["押司孔目：“我在这衙门二十年，什么风浪没见过。”（问他假票的事，他沉默了很久，然后说：“沈捕头，你也有债。这城里，谁不欠着谁一点什么。”）",
        "值堂的老兵：“我一个看门的，字都不识几个，票上写什么我怎知道。”",
        "司理院书吏：“文书过我的手要登簿，簿上笔笔有时辰。官人一查便知。”"],
   grayText:"押司请你吃了顿饭，席间不提案子，只说：“沈捕头，你我同僚一场。四十贯，够你还上一大截。这条线断在这儿，谁也不难堪。”（+40贯，恶名+15，主线就此断线）",
   grayGain:40*GUAN, grayInfamy:15,
   done:"押司交出那一匣条子的时候，手很稳。“我知道有这么一天。”他说。\n三年的消息，一月三贯。桩桩件件，写着金家怎么买通、怎么打点、怎么把该结的案压成悬案。\n知县看完那匣条子，半晌才开口：“这些，够翻多少旧案？”\n你说：够翻很多。但先翻眼下这一桩。"},

  {name:"金满堂罪证", reward:20*GUAN, unlock:25,
   suspects:null, culprit:-1,
   intro:"该轮到他了。\n金满堂在临汴放了十七年印子钱，苦主几十家，没有一家告赢过。你要的不是一桩案子，是钉死他的三条罪。",
   clues:["苦主陈婆子颤着手交出借据：三分利涂成一分利，涂改处对着日头照得真真的。伪造契书，一桩。",
          "漕司旧档翻出来了：金满堂名下货栈去年吃进四百石来路不明的绸货——正是幕一失的那批。销赃，两桩。",
          "押司那一匣条子里，夹着买通仓吏、买通闸官、压下三桩人命的往来。行赂坏法，三桩。",
          "吴先生的浑家从夹壁里取出真账全本：放印子、买仓吏、鸩账房，白纸黑字。人命，四桩。",
          "周二郎当堂具状，柳三画了押，设局逼债的一整条线，从酒桌到借据，串成了一根绳。齐了。"],
   say:null,
   grayText:"金满堂亲自登门，笑得一脸慈悲：“五十贯，你欠的再免三成，罪证还我。沈捕头，人要识时务。”（+50贯，恶名+15，主线就此断线）",
   grayGain:50*GUAN, grayInfamy:15,
   done:""},
];

/* ================= 行商 ================= */
function rollPrices() {
  GOODS.forEach(g => {
    let p = g.base * (g.id==="salt" ? 0.75 + Math.random()*0.5 : 0.8 + Math.random()*0.4);
    if (S.event && S.event.good===g.id) p = g.base * (S.event.dir>0 ? 2.0 : 0.4);
    S.prices[g.id] = Math.round(p/10)*10;
  });
}
function scheduleRumor() {
  // 每日约四成概率放出明日行情传闻
  if (!S.rumor && Math.random()<0.5) {
    const g = GOODS[Math.floor(Math.random()*GOODS.length)];
    const dir = Math.random()<0.6 ? 1 : -1;
    S.rumor = {good:g.id, dir};
    log(`【传闻】${dir>0?"听闻漕运受阻、货源吃紧，明日"+g.name+"价恐大涨。":"听闻大批"+g.name+"即将进城，明日价恐大跌。"}`,"sys");
  }
}
function invTotal(){ return GOODS.reduce((s,g)=>s+S.inv[g.id],0); }
function marketPrice(g, rural) {
  let p = S.prices[g.id];
  if (rural) p = Math.round(p * (g.id==="salt" ? 0.55 : 0.9) /10)*10; // 草市：土产九折，私盐贩子价
  return p;
}
function sellGood(g, price, rural) {
  S.money += price; S.inv[g.id]--;
  if (g.gray) { // 贩私盐，卖一担脏一分
    S.saltTick++;
    if (S.saltTick % 2 === 0) { gainInfamy(1); }
    if (S.saltTick === 2) log("盐是榷货。你倒卖私盐的事，瞒不了太久。","dim");
  }
}
function openTrade(rural) {
  const rows = GOODS.map(g=>{
    const p=marketPrice(g, rural), pct=Math.round(p/g.base*100);
    return {g,p,pct};
  });
  const body = rows.map(r=>`${r.g.name}：${r.p}文/担（平价${r.g.base}，现为${r.pct}%）持有${S.inv[r.g.id]}担${r.g.gray?"〔榷货，出手涨恶名〕":""}`).join("\n");
  const btns=[];
  rows.forEach(r=>{
    if (S.money>=r.p && invTotal()<S.loadCap) btns.push({text:`买${r.g.name}(${r.p})`,fn:()=>{S.money-=r.p;S.inv[r.g.id]++;openTrade(rural);}});
    if (S.inv[r.g.id]>0) btns.push({text:`卖${r.g.name}(${r.p})`,fn:()=>{sellGood(r.g,r.p,rural);openTrade(rural);},seal:r.pct>=115});
  });
  btns.push({text:"离开市集",fn:closeModal});
  modalBtns(rural?"城外草市":"东市行情",
    `身上银钱：${fmt(S.money)} ｜ 负重：${invTotal()}/${S.loadCap}担${rural?"\n（草市土产比城里贱一成；盐枭的私盐更贱，但那是榷货。）":""}\n\n${body}`, btns);
}

/* ================= 破案：小案 ================= */
function pickCase() {
  const avail = CASE_POOL.map((c,i)=>i).filter(i=>!S.casesUsed.includes(i));
  if (!avail.length) { S.casesUsed=[]; return pickCase(); }
  const i = avail[Math.floor(Math.random()*avail.length)];
  S.casesUsed.push(i);
  return CASE_POOL[i];
}
function caseInvestigate() {
  const c = S.caseTpl;
  const bribe = 100;
  if (S.money>=bribe) { S.money-=bribe; }
  S.stamina = Math.max(0, S.stamina-10);
  const clue = c.clues[S.caseClue];
  S.caseClue++;
  log(`【${c.name}】线索${S.caseClue}/${c.clues.length}：${clue}`);
  // 敲诈机会
  if (Math.random()<0.3) {
    const gain = (3+Math.floor(Math.random()*6))*GUAN;
    const SQUEEZE = [
      "问话问到半路，你撞见城东的刘员外从暗门里出来——里头住的可不是他家娘子。他堵在门口，脸一阵红一阵白。",
      "翻检旧档时，你发现税关的一笔漕税少写了个零。经手的书办正好路过，手里的茶盏当场就晃了。",
      "查访途中，米行的孙掌柜拉住你袖子——他囤米抬价的事，你上月就有耳闻，如今赈粜在即，他慌了。",
      "巷子里两个泼皮正给一处私赌场把风，见了你转身要跑，被你一把按住。场子的东家很快闻讯赶来，满脸堆笑。",
    ];
    modalBtns("路上的“机会”",
      `${SQUEEZE[Math.floor(Math.random()*SQUEEZE.length)]}\n对方愿出${fmt(gain)}，买你只当没看见。`,
      [{text:`收下（恶名+8）`,fn:()=>{S.money+=gain;gainInfamy(8);log(`收了乡绅${fmt(gain)}封口钱。`,"sys");closeModal();}},
       {text:"秉公办理",fn:()=>{log("你哼了一声，只当没看见那锭银子。","dim");closeModal();}}]);
  }
}
function caseAsk() {
  const c = S.caseTpl;
  if (!S.caseAsked) { S.caseAsked=true; S.stamina=Math.max(0,S.stamina-5); }
  const btns = c.suspects.map((sp,i)=>({text:sp,fn:()=>{
    modalBtns(`供词·${sp}`, c.say[i], [{text:"再问一个",fn:caseAsk},{text:"退堂",fn:closeModal}]);
  }}));
  btns.push({text:"退堂",fn:closeModal});
  modalBtns(`提审·${c.name}`, "三人都带到了堂下。你先问谁？", btns);
}
function caseAccuse() {
  const c = S.caseTpl;
  const btns = c.suspects.map((sp,i)=>({text:sp,fn:()=>{
    let r = c.reward;
    const ok = (i===c.culprit);
    if (ok) log(`【${c.name}】指认无误，人犯画押！领赏钱${fmt(r)}。`,"sys");
    else { r=Math.floor(r/2); log(`【${c.name}】拿错了人。真凶得了信，早出城了。知县把案卷摔在你面前，赏钱减半，得${fmt(r)}。`,"dim"); }
    S.money += r;
    const finish = ()=>{ S.caseTpl=null; S.caseClue=0; S.caseAsked=false; S.caseCooldown=1; closeModal(); };
    const txt = ok ? c.verdict : c.miss;
    if (txt) modalBtns(ok?`结案·${c.name}`:`错断·${c.name}`, `${txt}\n\n（赏钱${fmt(r)}）`,
      [{text:ok?"退堂":"罢了",fn:finish,seal:ok}]);
    else finish();
  }}));
  btns.push({text:"再想想",fn:closeModal});
  modalBtns(`${c.name}·指认`,
    S.caseClue>=c.clues.length ? "线索齐了。嫌犯三人，谁是真凶？（指认错误赏钱减半）"
      : "线索还没查全，你要凭现有的东西拿人。看走眼，赏钱减半，真凶逍遥。", btns);
}
function caseEat() {
  const c = S.caseTpl;
  const gain = c.reward*3;
  modalBtns("吃案", `嫌犯托人送来${fmt(gain)}，求你把案子办成悬案。\n（恶名+10，此案就此了结，无赏钱）`,
    [{text:"收钱结案",fn:()=>{S.money+=gain;gainInfamy(10);
       log(`【${c.name}】办成了悬案。袖子里多了${fmt(gain)}。`,"sys");
       S.caseTpl=null;S.caseClue=0;S.caseCooldown=2;closeModal();}},
     {text:"不干",fn:closeModal}]);
}

/* ================= 破案：主线 ================= */
function mainInvestigate() {
  const act = MAIN_ACTS[S.mainAct];
  if (S.mainClue===0 && act.intro && !S.mainIntro) { S.mainIntro=true; modal(`主线·${act.name}`, act.intro); }
  S.stamina = Math.max(0, S.stamina-10);
  if (S.money>=200) S.money-=200;
  const clue = act.clues[S.mainClue];
  S.mainClue++;
  log(`【主线·${act.name}】${S.mainClue}/${act.clues.length}：${clue}`,"sys");
  if (S.mainClue >= act.clues.length) {
    if (S.mainAct===MAIN_ACTS.length-1) { mainFinale(); return; }
    mainAccuse();
  }
}
function mainAsk() {
  const act = MAIN_ACTS[S.mainAct];
  if (!S.mainAsked) { S.mainAsked=true; S.stamina=Math.max(0,S.stamina-5); }
  const btns = act.suspects.map((sp,i)=>({text:sp,fn:()=>{
    modalBtns(`供词·${sp}`, act.say[i], [{text:"再问一个",fn:mainAsk},{text:"退堂",fn:closeModal}]);
  }}));
  btns.push({text:"退堂",fn:closeModal});
  modalBtns(`提审·${act.name}`, "人都带到了。你先问谁？", btns);
}
function mainAccuse() {
  const act = MAIN_ACTS[S.mainAct];
  const btns = act.suspects.map((sp,i)=>({text:sp,fn:()=>{
    if (i===act.culprit) {
      S.money+=act.reward;
      log(`【主线】${act.name}了结，领赏钱${fmt(act.reward)}。`,"sys");
      const nextAct = S.mainAct+1;
      const unlock = MAIN_ACTS[nextAct] ? MAIN_ACTS[nextAct].unlock : S.day+2;
      modalBtns(`主线·${act.name}·结案`, act.done,
        [{text:"退堂",seal:true,fn:()=>{
          S.mainAct=nextAct; S.mainClue=0; S.mainState="wait"; S.mainAsked=false; S.mainIntro=false;
          S.mainUnlockDay=Math.max(S.day+2, unlock);
          log(`（下一幕线索尚未浮出水面，约第${S.mainUnlockDay}日再来州衙。）`,"dim");
          closeModal();
        }}]);
    } else {
      S.money+=Math.floor(act.reward/2);
      log("【主线】指认有误！真凶得了信，线索断了大半。赏钱减半，两日后另寻门路再查。","dim");
      S.mainClue=Math.max(0,S.mainClue-2); S.mainState="wait"; S.mainUnlockDay=S.day+2;
      closeModal();
    }
  }}));
  btns.push({text:"再想想",fn:closeModal});
  modalBtns(`主线·${act.name}·指认`,"线索齐了，该拿人了。（指认错误赏钱减半，且要另寻门路）",btns);
}
function mainGray() {

/* ================= 灰色：恶名与查访 ================= */
function gainInfamy(n) {
  S.infamy += n;
  if (S.infamy>=70 && !S.chaFang2) { S.chaFang2=true; chaFang(2); }
  else if (S.infamy>=40 && !S.chaFang1) { S.chaFang1=true; chaFang(1); }
}
function chaFang(round) {
  const cost = Math.ceil(S.infamy/10)*GUAN;
  const btns=[];
  if (S.money>=cost) btns.push({text:`打点摆平（${fmt(cost)}）`,fn:()=>{S.money-=cost;
    log(`银子铺路，御史的卷宗里没了你的名字。破财${fmt(cost)}。`,"sys");closeModal();}});
  btns.push({text:"连夜毁证（五五之数）",fn:()=>{
    if (Math.random()<0.5) { log("烧了个干净。御史查了三日，悻悻而去。","sys"); closeModal(); }
    else if (round===2) { jailEnding(); }
    else { gainInfamy(20); log("毁证被人撞见！事情越描越黑（恶名+20）。","sys"); closeModal(); }
  }});
  if (round===1 && !btns.some(b=>b.text.includes("打点")))
    btns.push({text:"硬扛过去",fn:()=>{log("你咬牙扛了过去，但御史记下了你的名字。","dim");closeModal();}});
  modalBtns(round===1?"御史查访":"御史再临",
    round===1

  if (S.caseTpl) {

    if (S.caseClue >= 1)
      acts.push({name:S.caseClue<c.clues.length?`提前指认（线索${S.caseClue}/${c.clues.length}）`:`指认真凶：${c.name}`,

    if (c.say)
      acts.push({name:`提审嫌犯：${c.name}`, hint:S.caseAsked?"再听一遍供词 · 不耗时段":"三人各说各话 · 体力-5 · 不耗时段", can:()=>true, noSlot:true, run:caseAsk});

  } else if (S.caseCooldown<=0) {
    acts.push({name:"接一桩小案", hint:"衙门案卷里挑一件", can:()=>true, noSlot:true,
      run:()=>{S.caseTpl=pickCase();S.caseClue=0;S.caseAsked=false;
        log(`接下【${S.caseTpl.name}】（难度${"★".repeat(S.caseTpl.diff)}，赏钱${fmt(S.caseTpl.reward)}）。`);
        if (S.caseTpl.intro) modal(`案卷·${S.caseTpl.name}`, S.caseTpl.intro);}});
  } else {
    acts.push({name:"暂无新案卷", hint:`过${S.caseCooldown}日再来`, can:()=>false, run:()=>{}});
  }

  if (S.mainState==="ready"||S.mainState==="active") {

    if (S.mainClue < act.clues.length)
      acts.push({name:`主线·${act.name}（${S.mainClue}/${act.clues.length}）`, hint:"体力-10 · 打点200文", can:()=>true,
        run:()=>{S.mainState="active";mainInvestigate();}});
    if (act.say)
      acts.push({name:`提审：${act.name}`, hint:S.mainAsked?"再听一遍供词 · 不耗时段":"听各人的说法 · 体力-5 · 不耗时段", can:()=>true, noSlot:true, run:mainAsk});
    if (act.suspects && S.mainClue>=act.clues.length)
      acts.push({name:`指认真凶：${act.name}`, hint:"不耗时段", can:()=>true, noSlot:true, run:mainAccuse});
    if (S.mainClue>0)

/* ================= 时间推进 ================= */
function doAction(a) {
  if (S.over) return;
  a.run();
  if (a.noSlot) { render(); return; }
  advanceSlot();
}
function advanceSlot() {
  if (S.over) { render(); return; }
  if (S.stamina<=0) { bedridden(); return; }
  S.slot++;
  if (S.slot>=SLOTS.length) endDay();
  render();
}
function bedridden() {
  S.money=Math.max(0,S.money-SICK_COST);
  S.stamina=50;
  log(`你体力耗尽，一头栽倒。请郎中花去${SICK_COST}文，卧床一日。`,"sys");
  endDay(true); render();
}
function endDay(skipLog) {
  if (S.money>=FOOD_COST) S.money-=FOOD_COST;
  else { S.money=0; S.stamina=Math.max(1,S.stamina-10); log("囊中羞涩，只喝了碗稀粥。体力-10。","dim"); }
  if (S.day%10===0) {
    if (S.money>=RENT_COST) { S.money-=RENT_COST; log("交了房租1贯。","dim"); }
    else { S.debt+=RENT_COST; log("房租交不出，房东记在账上（债务+1贯）。","sys"); }
    // 店铺分红与陋规
    if (S.shopTea) {
      let div = S.shopTea===2 ? 5000 : SHOP_TEA_DIV;
      const r = Math.random();
      if (r<0.25) { div=Math.round(div*1.5); log("这一旬茶坊生意红火（分红×1.5）。","dim"); }
      else if (r<0.4) { div-=1000; log("衙前来茶坊‘借’了一回茶钱（分红-1贯）。","dim"); }
      S.money+=div; log(`茶坊分红${fmt(div)}。`,"sys");
    }
    if (S.shopCasino) {
      let div = S.shopCasino===2 ? 12000 : SHOP_CASINO_DIV;
      const r = Math.random();
      if (r<0.25) { div=Math.round(div*1.5); log("这一旬赌坊夜夜满座（分红×1.5）。","dim"); }
      else if (r<0.4) { div-=2000; log("赌坊有人闹事砸了桌椅（分红-2贯）。","dim"); }
      S.money+=div; gainInfamy(S.shopCasino===2?3:2); log(`赌坊分红${fmt(div)}（恶名+${S.shopCasino===2?3:2}）。`,"sys"); }
    if (S.louGui) { S.money+=1500; gainInfamy(3); log("各家商户的平安钱收上来了，1.5贯（恶名+3）。","sys"); }
  }
  checkNode(S.day);
  if (S.over) return;
  S.day++;
  S.slot=0;
  S.ateToday=false;
  if (S.caseCooldown>0) S.caseCooldown--;
  if (S.mainState==="wait" && S.day>=S.mainUnlockDay) S.mainState="ready";
  if (S.day>TOTAL_DAYS) { finale(); return; }
  // 行情
  S.event = S.rumor ? {good:S.rumor.good, dir:S.rumor.dir} : null;
  S.rumor = null;
  rollPrices();
  if (S.event) {
    const g=GOODS.find(x=>x.id===S.event.good);
    log(`【行情】${g.name}价${S.event.dir>0?"果然大涨！":"应声大跌。"}今日${S.prices[g.id]}文/担。`,"sys");
  }
  scheduleRumor();
  if (!skipLog) log(`—— 第${S.day}天 ——`,"dim");
  // 街头随闻
  if (Math.random()<0.4) {
    const pool = STREET_EVENTS.filter(e=>e.cond());
    const ev = pool[Math.floor(Math.random()*pool.length)];
    ev.fx(); log("【街闻】"+ev.text,"dim");
  }
}
function checkNode(day) {
  if (day===TOTAL_DAYS) { finale(); return; }
  const need=NODES[day];
  if (!need) return;
  if (S.repaid>=need)
    modal("还款节点",`第${day}天：你已还${fmt(S.repaid)}，够了${fmt(need)}的数。\n金满堂皮笑肉不笑：“沈捕头果然是条汉子，下一笔，可别误了。”`);
  else {
    S.debt+=VIOLATE_INTEREST;
    S.stamina=Math.max(1,S.stamina-30);
    modal("违约！",`第${day}天该还够${fmt(need)}，你只还了${fmt(S.repaid)}。\n夜里两条大汉堵在巷口把你按着揍了一顿（体力-30），临走撂话：利钱再加五贯！`);
  }
}
function finale() {
  S.over=true;
  if (S.debt<=0) {
    if (S.infamy<30)
      modal("结局·青天捕头","三十日期满，你把最后一串铜钱拍在金满堂案上，当面烧了借据。\n你还是临汴城的捕快，且是百姓交口称赞的好捕快。\n"+(S.mainAct>=3?"周二郎在码头替人记账，见你走过，远远地喊一声“砚哥”。":"只是每回路过码头，你还会想起那个跑掉的发小。"),true);
    else
      modal("结局·笑面阎罗","钱是还清了。只是夜里走过街市，商户纷纷关门下板，百姓都躲着你走。\n这一百贯，沾着别人的血。金满堂倒是高看了你一眼：“沈捕头，是同道中人。”",true);
  } else {
    modal("结局·革役归田",`三十日期满，你还欠${fmt(S.debt)}。\n金满堂的状书递进了州衙。三日后，你交还了铁尺与腰牌，出城时没人相送。\n城门外的官道很长，你想，去南边找周二郎算账，也算个营生。`,true);
  }
  render();
}

/* ================= 还款 ================= */
function openLedger() {
  const canPay=Math.min(S.money,S.debt);
  const btns=[];
  [5,10,20].forEach(g=>{ const amt=g*GUAN; if(amt<=canPay) btns.push({text:`还${g}贯`,fn:()=>repay(amt)}); });
  if (canPay>0) btns.push({text:`尽数还上（${fmt(canPay)}）`,fn:()=>repay(canPay),seal:true});
  btns.push({text:"先不还",fn:closeModal});
  modalBtns("账本",`剩余债务：${fmt(S.debt)}\n已还总额：${fmt(S.repaid)}\n身上银钱：${fmt(S.money)}\n\n${nextNodeText()}`,btns);
}
function repay(amt) {
  S.money-=amt; S.debt-=amt; S.repaid+=amt;
  log(`往金满堂柜上送去${fmt(amt)}。剩余债务${fmt(S.debt)}。`,"sys");
  closeModal();
  if (S.debt<=0) finale(); else render();
}
function nextNodeText() {
  for (const d of Object.keys(NODES).map(Number).sort((a,b)=>a-b))
    if (S.day<=d && S.repaid<NODES[d]) return `下一节点：第${d}天前累计还够${fmt(NODES[d])}`;
  return `最后期限：第${TOTAL_DAYS}天全部还清`;
}

/* ================= 界面 ================= */
function fmt(wen) {
  const g=Math.floor(wen/GUAN), w=wen%GUAN;
  if (g&&w) return `${g}贯${w}文`;
  if (g) return `${g}贯`;
  return `${w}文`;
}
function render() {
  document.getElementById("hdr-day").textContent = S.over?"剧终":`第${S.day}天 · ${SLOTS[S.slot]}`;
  document.getElementById("stats").innerHTML =
    `<span>银钱 <b>${fmt(S.money)}</b></span>`+
    `<span>体力 <b>${S.stamina}</b>/100${S.stamina<20?" ⚠":""}</span>`+
    `<span>恶名 <b>${S.infamy}</b>${S.infamy>=40?" ⚠":""}</span>`+
    `<span>负重 <b>${invTotal()}</b>/${S.loadCap}担</span>`;
  document.getElementById("debtline").innerHTML =
    `欠债 <b style="color:var(--seal)">${fmt(S.debt)}</b> ｜ 已还 ${fmt(S.repaid)} ｜ ${nextNodeText()}`;
  const locBox=document.getElementById("locations");
  locBox.innerHTML="";
  LOCATIONS.forEach(l=>{
    const b=document.createElement("button");
    b.textContent=l.name;
    b.disabled=S.over;
    if (l.id===S.loc){b.style.background="var(--ink)";b.style.color="var(--paper)";}
    b.onclick=()=>{S.loc=l.id;render();};
    locBox.appendChild(b);
  });
  const ledger=document.createElement("button");
  ledger.textContent="账本·还款"; ledger.className="seal"; ledger.disabled=S.over; ledger.onclick=openLedger;
  locBox.appendChild(ledger);
  document.getElementById("loc-title").textContent=LOCATIONS.find(l=>l.id===S.loc).name;
  document.getElementById("scene").innerHTML =
    ART_OVERRIDE[S.loc] ? `<img src="${ART_OVERRIDE[S.loc]}" alt="">` : (SCENES[S.loc]||"");
  const actBox=document.getElementById("actions");
  actBox.innerHTML="";
  let acts=ACTIONS[S.loc]||[];
  if (S.loc==="yamen") acts=yamenActions();
  if (S.loc==="casino") acts=[...casinoActions()];
  if (S.loc==="tea") acts=[...teaActions()];
  acts.forEach(a=>{
    const wrap=document.createElement("div");
    const b=document.createElement("button");
    b.textContent=a.name;
    b.disabled=S.over||!a.can();
    b.onclick=()=>doAction(a);
    const hint=document.createElement("span");
    hint.className="hint"; hint.textContent=" "+a.hint;
    wrap.appendChild(b); wrap.appendChild(hint);
    actBox.appendChild(wrap);
  });
  if (S.over) {
    const rb=document.createElement("button");
    rb.textContent="重新来过"; rb.className="seal"; rb.onclick=newGame;
    actBox.appendChild(rb);
  }
}

const ENDING_ART = {"青天捕头":"end_repaid","笑面阎罗":"end_repaid","革役归田":"end_fired","锒铛入狱":"end_prison","反客为主":"end_hidden"};
function modal(title,text,ended){
  if (ended) {
    const t = title.replace(/^结局·/,"");

    cinematic(t, text, "剧终", "再来一局", ()=>{hideCine(); newGame();}, key?ENDING_ART[key]:null);
    return;
  }
  modalBtns(title,text,[{text:"知道了",fn:closeModal}]);
}
function cinematic(title, body, seal, btnText, btnFn, imgKey) {
  const im = document.getElementById("c-img");
  if (imgKey && ART[imgKey]) im.src = ART[imgKey]; else im.removeAttribute("src");
  document.getElementById("c-title").textContent = title;
  document.getElementById("c-body").textContent = body;
  document.getElementById("c-seal").textContent = seal;
  const b = document.getElementById("c-btn");
  b.textContent = btnText; b.onclick = btnFn;
  const el = document.getElementById("cine");
  el.classList.remove("show","rush"); void el.offsetWidth; // 重置动画
  el.classList.add("show");
  el.scrollTop = 0;
  el.onclick = (e) => { if (e.target !== b) el.classList.add("rush"); };
}
function hideCine(){ document.getElementById("cine").classList.remove("show"); }
function modalBtns(title,text,btns){
  document.getElementById("m-title").textContent=title;
  document.getElementById("m-text").textContent=text;
  const box=document.getElementById("m-btns"); box.innerHTML="";
  btns.forEach(b=>{ const el=document.createElement("button"); el.textContent=b.text;
    if(b.seal)el.className="seal"; el.onclick=b.fn; box.appendChild(el); });
  document.getElementById("overlay").classList.add("show");
}
function closeModal(){ document.getElementById("overlay").classList.remove("show"); render(); }
